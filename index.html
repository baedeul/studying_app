<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>학습 시간 카운터</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>📚 학습 시간 카운터</h1>
      <p class="subtitle">오늘의 집중 학습 시간을 기록해보세요.</p>

      <section class="timer-card">
        <div id="timer-display" class="timer-display" aria-live="polite">00:00:00</div>
        <div class="button-row">
          <button id="start-btn" class="btn primary">시작</button>
          <button id="pause-btn" class="btn" disabled>일시정지</button>
          <button id="reset-btn" class="btn danger">초기화</button>
        </div>
      </section>

      <section class="summary-card">
        <h2>오늘의 학습 요약</h2>
        <p>총 학습 시간: <strong id="total-display">00:00:00</strong></p>
        <ul id="session-list" class="session-list" aria-label="학습 세션 목록"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
